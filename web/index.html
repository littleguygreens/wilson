<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1216">
<title>seedscan</title>
<style>
  :root {
    --bg: #0f1216;
    --panel: #181d24;
    --panel-2: #1f2630;
    --line: #2a323d;
    --text: #e7ecf2;
    --muted: #8b97a6;
    --accent: #4ea1ff;
    --accent-press: #2f7fe0;
    --good: #57d98a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 14px 40px; }

  header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
  header h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }

  .controls {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
  }
  .fields { display: flex; gap: 10px; }
  /* min-width:0 lets the number inputs shrink below their wide intrinsic size,
     otherwise they overflow the viewport on narrow phones. */
  .field { flex: 1; min-width: 0; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    font-size: 17px;
    padding: 12px 12px;
    -webkit-appearance: none;
    appearance: none;
  }
  input:focus { outline: none; border-color: var(--accent); }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%;
    margin-top: 12px;
    border: 0;
    border-radius: 12px;
    padding: 15px;
    font-size: 17px;
    font-weight: 600;
    color: #071018;
    background: var(--accent);
    cursor: pointer;
    touch-action: manipulation;
  }
  .btn:active { background: var(--accent-press); }
  .btn.stop { background: #35404d; color: var(--text); }
  .hidden { display: none !important; }

  .status {
    display: flex; align-items: center; gap: 14px;
    margin: 16px 2px 6px;
    color: var(--muted); font-size: 14px;
  }
  .status b { color: var(--text); font-variant-numeric: tabular-nums; }
  .spin {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--line); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty { color: var(--muted); text-align: center; padding: 40px 10px; font-size: 14px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px;
    margin-top: 12px;
    animation: pop .25s ease;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .card .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .seed {
    font-size: 18px; font-weight: 700; letter-spacing: .2px;
    font-variant-numeric: tabular-nums;
    word-break: break-all;
  }
  .copy {
    flex: none;
    background: var(--panel-2); border: 1px solid var(--line);
    color: var(--muted); border-radius: 8px;
    padding: 7px 10px; font-size: 12px; cursor: pointer;
  }
  .copy.done { color: var(--good); border-color: var(--good); }
  .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .card img {
    display: block; width: 100%; height: auto;
    margin-top: 10px; border-radius: 10px;
    background: var(--panel-2);
    image-rendering: pixelated;
    aspect-ratio: 1 / 1;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>seedscan</h1>
    <p>island · peaks · lush caves</p>
  </header>

  <div class="controls">
    <div class="fields">
      <div class="field">
        <label for="n">Matches</label>
        <input id="n" type="number" inputmode="numeric" min="1" value="5">
      </div>
      <div class="field">
        <label for="workers">Workers</label>
        <input id="workers" type="number" inputmode="numeric" min="1" placeholder="auto">
      </div>
    </div>
    <button id="go" class="btn" onclick="start()">Scan</button>
    <button id="stop" class="btn stop hidden" onclick="stop()">Stop</button>
  </div>

  <div class="status">
    <span id="spin" class="spin hidden"></span>
    <span>tested <b id="tested">0</b></span>
    <span>found <b id="found">0</b></span>
  </div>

  <div id="results"></div>
  <div id="empty" class="empty">No matches yet. Tap Scan to start hunting.</div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  let es = null;

  function setRunning(running) {
    $('go').classList.toggle('hidden', running);
    $('stop').classList.toggle('hidden', !running);
    $('spin').classList.toggle('hidden', !running);
  }

  function start() {
    if (es) es.close();

    const n = Math.max(1, parseInt($('n').value, 10) || 5);
    const wRaw = parseInt($('workers').value, 10);
    const workers = Number.isFinite(wRaw) && wRaw > 0 ? wRaw : 0;

    $('results').innerHTML = '';
    $('empty').classList.add('hidden');
    $('tested').textContent = '0';
    $('found').textContent = '0';
    setRunning(true);

    const qs = new URLSearchParams({ n, workers });
    es = new EventSource('/api/scan?' + qs.toString());

    es.addEventListener('progress', (e) => {
      $('tested').textContent = fmt(JSON.parse(e.data).tested);
    });
    es.addEventListener('match', (e) => addMatch(JSON.parse(e.data)));
    es.addEventListener('done', (e) => {
      $('tested').textContent = fmt(JSON.parse(e.data).tested);
      stop();
    });
    es.onerror = () => stop(); // connection ended (done, stopped, or dropped)
  }

  function stop() {
    if (es) { es.close(); es = null; }
    setRunning(false);
    if (!$('results').children.length) $('empty').classList.remove('hidden');
  }

  function addMatch(m) {
    $('found').textContent = String((parseInt($('found').textContent, 10) || 0) + 1);
    const url = `/api/map?seed=${m.seed}&sx=${m.spawnX}&sz=${m.spawnZ}`;

    const card = document.createElement('div');
    card.className = 'card';

    const row = document.createElement('div');
    row.className = 'row';
    const seed = document.createElement('span');
    seed.className = 'seed';
    seed.textContent = m.seed;
    const copy = document.createElement('button');
    copy.className = 'copy';
    copy.textContent = 'Copy';
    copy.onclick = () => copySeed(String(m.seed), copy);
    row.append(seed, copy);

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = `spawn ${m.spawnX}, ${m.spawnZ}  ·  lush ${m.lush}`;

    const img = document.createElement('img');
    img.loading = 'lazy';
    img.alt = 'biome map for seed ' + m.seed;
    img.src = url;

    card.append(row, meta, img);
    $('results').prepend(card);
  }

  function copySeed(text, btn) {
    const ok = () => { btn.textContent = 'Copied'; btn.classList.add('done'); setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('done'); }, 1200); };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(ok, () => fallbackCopy(text, ok));
    else fallbackCopy(text, ok);
  }

  function fallbackCopy(text, ok) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); ok(); } catch (_) {}
    document.body.removeChild(ta);
  }

  function fmt(n) { return Number(n).toLocaleString(); }
</script>
</body>
</html>
